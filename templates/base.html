<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>{% block title %}Fergus Kidd{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <script src="/static/js/theme.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip" href="#content">Skip to content</a>
    <header class="nav" id="nav">
        <a class="brand" href="/">
            <img src="/static/images/logo.png" alt="" width="38" height="38">
            <span>Fergus <em>Kidd</em></span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
        <nav class="nav-links" id="nav-links">
            <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Home</a>
            <a href="/about" {% if request.url.path == "/about" %}aria-current="page"{% endif %}>About</a>
            <a href="/talk" {% if request.url.path == "/talk" %}aria-current="page"{% endif %}>Talk</a>
            <a href="https://fieldpal.ai" target="_blank" rel="noopener noreferrer">FieldPal</a>
            <a href="https://www.linkedin.com/in/fergus-kidd-1a222667/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/FergusKidd" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
        <div class="nav-tools">
            <button id="toggle-dark" class="icon-btn" type="button" aria-label="Toggle color theme" aria-pressed="true">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                </svg>
            </button>
            <button id="toggle-contrast" class="icon-btn" type="button" aria-label="High contrast" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M13 2 3 14h8l-1 8 11-14h-8l0-6z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main id="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ current_year }} Fergus Kidd</p>
    </footer>

    <button class="to-top" id="to-top" type="button" aria-label="Back to top">↑</button>
    <script src="/static/js/site.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
