{% extends "base.html" %}

{% block title %}{{ post.title }} | Fergus Kidd{% endblock %}

{% block content %}
<article class="article-shell">
    <header>
        <p class="page-kicker"><time datetime="{{ post.date }}">{{ post.date | format_date }}</time></p>
        <h1 class="page-title">{{ post.title }}</h1>
    </header>
    {% if post.feature_image %}
    <figure class="post-media">
        <img src="{{ post.feature_image }}" alt="">
    </figure>
    {% endif %}
    <div class="prose">
        {{ post.content | safe }}
    </div>
    <a class="back" href="/">Back to notes</a>
</article>
{% endblock %}
